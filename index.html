<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kit Integral de Formatos de Talento Humano</title>
    <style>

            --ink: #0f172a;
            --mut: #64748b;
            --ln: #dbe1ea;
            --pri: #2b4acb;
            --soft: #eef2ff;
            --nav: #0e1a36
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            font: 14px/1.45 "Plus Jakarta Sans", system-ui, "Segoe UI", sans-serif;
            background: #e9edf3;
            color: var(--ink)
        }

        .app {
            display: grid;
            grid-template-columns: 300px 1fr
        }

        aside {
            background: var(--nav);
            color: #dbe4ff;
            padding: 18px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        aside h1 {
            font-size: 16px;
            color: #fff;
            line-height: 1.25
        }

        aside h4 {
            font-size: 12px;
            color: #8fa3d9;
            font-weight: 600;
            margin-bottom: 6px
        }

        aside label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px
        }

        aside input,
        aside select {
            width: 100%;
            margin-top: 3px;
            padding: 7px 9px;
            border-radius: 6px;
            border: 1px solid #2a3a66;
            background: #16254a;
            color: #fff;
            font: inherit
        }

        .nav button {
            display: flex;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            border: 0;
            border-radius: 6px;
            background: none;
            color: #cbd6f5;
            font: inherit;
            cursor: pointer
        }

        .nav button.on {
            background: var(--pri);
            color: #fff
        }

        .nav small {
            opacity: .7;
            min-width: 74px
        }

        .tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }

        .btn {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #2f4175;
            background: #16254a;
            color: #e6ecff;
            font: inherit;
            font-size: 13px;
            cursor: pointer

            border-color: var(--pri)

        .btn.on {

            color: #2a1c00;
            border-color: #f5b82e
        }

            padding: 24px;
            display: flex;
            justify-content: center
        }

        .sheet {
            display: none;
            background: #fff;
            width: 100%;
            max-width: 900px;
            padding: 32px;
            border-radius: 6px;
            box-shadow: 0 1px 3px #0002, 0 8px 24px #0f172a14;

        .sheet.on {
            display: block

        .sh {
            display: grid;
            grid-template-columns: 20% 1fr 24%;
            border: 1px solid var(--ln);
            margin-bottom: 18px
        }

        .sh.sh-md {
            grid-template-columns: 20% 1fr
        }

        .sh>div {
            padding: 10px 12px;
            border-right: 1px solid var(--ln);
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .sh>div:last-child {
            border-right: 0

        .sh-info {
            font-size: 11px;
            background: #f6f8fb
        }

        .lg {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 55px
        }

        .logo-upload {
            width: 100%;
            height: 100%;
            min-height: 50px;
            border: 1.5px dashed #94a3b8;
            border-radius: 6px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            transition: .2s;
            user-select: none;
            padding: 4px;
            text-align: center
        }

        .logo-upload:hover {
            border-color: var(--pri);
            background: #eef2ff;
            color: var(--pri)
        }

        .logo-upload .logo-ico {
            font-size: 16px;
            line-height: 1
        }

        .logo-upload .logo-txt {
            font-size: 10px
        }

        .logo-prev {
            position: relative;
            max-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .logo-img {
            max-height: 60px;
            max-width: 100%;
            object-fit: contain
        }

        .logo-del {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px #0003;
            line-height: 1;
            transition: .15s;
            z-index: 2
        }

        .logo-del:hover {
            background: #dc2626;
            transform: scale(1.1)
        }

        .lg-name {
            font-weight: 700;
            color: var(--pri);
            font-size: 13px;
            letter-spacing: .3px;
            margin-bottom: 2px
        }

        .tt {
            text-align: center
        }

        .tt h2 {
            font-size: 15px;
            color: var(--pri)
        }

        .tt p {
            font-size: 11px;
            color: var(--mut)
        }

        .sec {
            margin-top: 18px
        }

        .sec h3 {
            font-size: 13px;
            color: var(--pri);
            border-left: 4px solid var(--pri);
            padding-left: 8px;
            margin-bottom: 10px

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px
        }

        .full {
            grid-column: 1/-1
        }

        .fd>label {

            justify-content: space-between;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;

            padding: 7px 9px;

        .ck {

        th {

            font-size: 11px;

            font-size: 12px;
            vertical-align: middle

        td :is(input:not([type=radio], [type=checkbox]), select) {

            padding: 3px
        }

        .x {
            width: 30px;
            text-align: center
        }

        [contenteditable] {
            outline: none;
            display: block;
            min-height: 1.3em
        }

        .edt {
            background: #fff8dc;
            outline: 1px dashed #e0b43a;
            border-radius: 3px

            background: var(--soft);
            color: var(--pri);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            padding: 1px 6px

            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px

        .add .mini {
            padding: 5px 10px;
            font-size: 12px

            width: auto !important
        }

            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

            margin-top: 36px

            flex-direction: column;
            align-items: center;
            text-align: center

            height: 80px;
            min-height: 80px;

            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
            border: 1.5px dashed #94a3b8;
            border-radius: 6px;
            background: #f8fafc;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            color: #475569;
            font-size: 11px;
            font-weight: 600;

            padding: 4px
        }

            border-color: var(--pri);
            background: #eef2ff;
            color: var(--pri)
        }

        .sig-upload .sig-ico {
            font-size: 18px;
            line-height: 1
        }

        .sig-upload .sig-txt {
            font-size: 11px
        }

        .sig-prev {
            position: relative;
            max-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .sig-img {
            max-height: 76px;
            max-width: 100%;
            object-fit: contain
        }

        .sig-del {
            position: absolute;
            top: -4px;
            right: -22px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px #0003;
            line-height: 1;
            transition: .15s
        }

        .sig-del:hover {
            background: #dc2626;
            transform: scale(1.1)
        }

        .sig-info {
            width: 100%;
            border-top: 1px solid #94a3b8;
            padding-top: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: center
        }

        .sig-info small {
            display: block;
            font-weight: 400;
            color: var(--mut)
        }

        .note {
            margin-left: 18px;
            font-size: 12px
        }

        @media screen and (max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                position: static;
                height: auto
            }

            .grid,
            .sigs,
            .sh {
                grid-template-columns: 1fr
            }

            main {
                padding: 10px
            }

            .sheet {
                padding: 16px
            }
        }

        @media print {
            @page {
                size: letter portrait;
                margin: 10mm 12mm 10mm 12mm;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
                box-sizing: border-box !important;
            }

            aside,
            .noprint,
            .sig-upload,
            .sig-del,
            .tools,
            .add,
            .mini,
            .x,
            .x2,
            input[type="file"] {
                display: none !important;
            }

            html,
            body {
                background: #fff !important;
                color: var(--ink) !important;
                font-family: "Plus Jakarta Sans", system-ui, "Segoe UI", sans-serif !important;
                font-size: 12px !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .app {
                display: block !important;
                width: 100% !important;
            }

            main {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }

            .sheet {
                display: none;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 0 20px 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                break-after: page;
                page-break-after: always;
            }

            .sheet.on,
            body.pall .sheet {
                display: block !important;
            }

            /* Estructura del encabezado idéntica a pantalla (3 columnas) */
            .sh {
                display: grid !important;
                grid-template-columns: 22% 1fr 24% !important;
                border: 1px solid var(--ln) !important;
                margin-bottom: 16px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .sh.sh-md {
                grid-template-columns: 22% 1fr !important;
            }

            .sh>div {
                padding: 8px 10px !important;
                border-right: 1px solid var(--ln) !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
            }

            .sh>div:last-child {
                border-right: 0 !important;
            }

            .sh-info {
                font-size: 11px !important;
                background: #f6f8fb !important;
            }

            .lg {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                min-height: 45px !important;
            }

            .logo-img {
                max-height: 55px !important;
                max-width: 100% !important;
                object-fit: contain !important;
            }

            .lg-name {
                font-weight: 700 !important;
                color: var(--pri) !important;
                font-size: 12px !important;
                margin-bottom: 2px !important;
            }

            .tt {
                text-align: center !important;
            }

            .tt h2 {
                font-size: 14px !important;
                color: var(--pri) !important;
                margin: 0 0 2px !important;
            }

            .tt p {
                font-size: 11px !important;
                color: var(--mut) !important;
                margin: 0 !important;
            }

            /* Secciones */
            .sec {
                margin-top: 14px !important;
                page-break-inside: auto !important;
            }

            .sec h3 {
                font-size: 12px !important;
                color: var(--pri) !important;
                border-left: 4px solid var(--pri) !important;
                padding-left: 8px !important;
                margin-bottom: 8px !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* Cuadrícula de formulario (2 columnas idéntica a pantalla) */
            .grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 8px 14px !important;
            }

            .full {
                grid-column: 1 / -1 !important;
            }

            .fd {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .fd>label {
                display: flex !important;
                justify-content: space-between !important;
                gap: 6px !important;
                font-size: 11px !important;
                font-weight: 600 !important;
                color: #334155 !important;
                margin-bottom: 2px !important;

            /* Campos de entrada: conserva la estructura visual de cajas como en pantalla */
            .sheet :is(input:not([type=radio], [type=checkbox]), select, textarea) {
                width: 100% !important;
                padding: 5px 8px !important;
                border: 1px solid #cbd5e1 !important;
                border-radius: 4px !important;

                appearance: none !important;
                -webkit-appearance: none !important;
            }

            .sheet textarea {
                min-height: 48px !important;
                resize: none !important;
            }

            /* Opciones de radio y casillas */
            .opts {
                display: flex !important;
                flex-wrap: wrap !important;
                gap: 6px 14px !important;
            }

            .opts label,
            .ck {
                display: inline-flex !important;
                align-items: center !important;
                gap: 5px !important;
                font-size: 12px !important;
                color: var(--ink) !important;
            }

            input[type="radio"],
            input[type="checkbox"] {
                appearance: auto !important;
                -webkit-appearance: auto !important;
                margin: 0 !important;
            }

            /* Tablas */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                margin-top: 4px !important;
                page-break-inside: auto !important;
            }

            th {
                background: var(--soft) !important;
                color: var(--pri) !important;
                font-size: 11px !important;
                font-weight: 700 !important;
                border: 1px solid #cbd5e1 !important;
                padding: 5px 6px !important;
                text-align: left !important;
            }

            th,
            td {
                border: 1px solid #cbd5e1 !important;
                padding: 4px 6px !important;
                font-size: 11px !important;
                vertical-align: middle !important;
            }

            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            td :is(input:not([type=radio], [type=checkbox]), select) {
                border: 0 !important;
                padding: 2px !important;
                background: transparent !important;
                font-size: 11px !important;
            }

            /* Espacios para firmas idénticos a pantalla en horizontal */
            .sigs {
                display: grid !important;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
                gap: 20px !important;
                margin-top: 28px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .sig-card {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
            }

                height: 65px !important;

                align-items: center !important;

            }

                max-width: 100% !important;
                object-fit: contain !important;
            }

                width: 100% !important;
                border-top: 1px solid #94a3b8 !important;
                padding-top: 5px !important;
                font-size: 11px !important;
                font-weight: 600 !important;
                text-align: center !important;
            }

                display: block !important;
                font-weight: 400 !important;
                font-size: 10px !important;

            }

        aside>* {

            calc(); flt()
        }
        function exp() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'formatos_talento_humano.json'; a.click() }

            const t = e.target;

            if (t.dataset.v !== undefined) { const a = o[k] = Array.isArray(o[k]) ? o[k] : [], j = a.indexOf(t.dataset.v); t.checked ? j < 0 && a.push(t.dataset.v) : j >= 0 && a.splice(j, 1) }
            else o[k] = t.type == 'checkbox' ? t.checked : t.value;
            if (t.dataset.b == 'caso') { const c = CASES.find(x => x.n == t.value); if (c) Object.assign(S.shared, c.p); save(); render(); return }
            if (t.dataset.b) document.querySelectorAll(`[data-b="${t.dataset.b}"]`).forEach(n => { if (n !== t) n.value = t.value });
            calc(); save()
        });
        function readImg(file, cb) { const r = new FileReader(); r.onload = ev => { const img = new Image(); img.onload = () => { try { const maxW = 500, maxH = 200; let w = img.width, h = img.height; if (w > maxW || h > maxH) { const ratio = Math.min(maxW / w, maxH / h); w = Math.round(w * ratio); h = Math.round(h * ratio) } const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h; const ctx = cvs.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); cb(cvs.toDataURL(file.type == 'image/png' ? 'image/png' : 'image/jpeg', 0.88)) } catch (_) { cb(ev.target.result) } }; img.onerror = () => cb(ev.target.result); img.src = ev.target.result }; r.readAsDataURL(file) }
        document.addEventListener('change', e => {
            const t = e.target;
            if (t && t.classList && t.classList.contains('sig-file')) { const file = t.files && t.files[0]; if (!file) return; readImg(file, dataUrl => { const [o, k] = R[t.dataset.sig]; o[k] = dataUrl; save(); render() }) }
            if (t && t.classList && t.classList.contains('logo-file')) { const file = t.files && t.files[0]; if (!file) return; readImg(file, dataUrl => { S.logo = dataUrl; save(); render() }) }

            if (logoUp) { e.preventDefault(); const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!file || !file.type.startsWith('image/')) return; readImg(file, dataUrl => { S.logo = dataUrl; save(); render() }); return }
        });
        document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) A[b.dataset.act]() });
        $('imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(x => { try { const s = mig(JSON.parse(x)); if (!OK(s)) throw 0; S = s; save(); render() } catch (_) { alert('El archivo no es un respaldo válido de este kit de formatos.') } }) };
